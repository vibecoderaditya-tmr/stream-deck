<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OBS Remote Director — Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div id="auth-screen">
  <div class="auth-box">
    <h1>OBS Remote Director</h1>
    <p>Admin Login — Enter PIN</p>
    <input type="password" id="pin-input" maxlength="8" placeholder="PIN" autofocus>
    <button id="pin-submit">Login</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app-screen" class="admin-layout">

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">OBS<br>Director</div>
    <nav class="sidebar-nav">
      <a class="sidebar-link active" data-section="buttons">
        <span class="sidebar-icon">&#9638;</span>
        <span>Buttons</span>
      </a>
      <a class="sidebar-link" data-section="pages">
        <span class="sidebar-icon">&#9776;</span>
        <span>Pages</span>
      </a>
      <a class="sidebar-link" data-section="settings">
        <span class="sidebar-icon">&#9881;</span>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <a href="index.html" class="sidebar-link">
        <span class="sidebar-icon">&#8592;</span>
        <span>Deck</span>
      </a>
    </div>
  </aside>

  <!-- Main Wrapper -->
  <div class="main-wrap">

    <!-- Top Header -->
    <header class="topbar">
      <div class="topbar-title">Buttons</div>
      <div class="topbar-status">
        <span class="status-item"><span class="status-dot" id="dot-obs"></span> OBS</span>
        <span class="status-item"><span class="status-dot" id="dot-firebase"></span> Firebase</span>
      </div>
    </header>

    <!-- Buttons Section -->
    <section class="section section-active" id="section-buttons">
      <div class="split-panel">

        <!-- Left: Grid -->
        <div class="panel-left">
          <div class="grid-toolbar">
            <button class="page-arrow" id="page-prev">&lt;</button>
            <select id="page-select" class="page-select"></select>
            <button class="page-arrow" id="page-next">&gt;</button>
            <span class="grid-size-display" id="grid-size-display">4x8</span>
          </div>
          <div class="grid-scroll">
            <div class="button-grid" id="button-grid"></div>
          </div>
        </div>

        <!-- Right: Editor -->
        <div class="panel-right" id="panel-right">
          <div class="editor-empty" id="editor-empty">
            <p>Select a button to edit</p>
          </div>
          <div class="editor-form" id="editor-form" style="display:none;">

            <!-- Preview -->
            <div class="editor-section">
              <div class="editor-section-title">Preview</div>
              <div class="btn-preview-wrap">
                <div class="btn-preview" id="btn-preview">
                  <span class="btn-preview-icon" id="preview-icon"></span>
                  <span class="btn-preview-label" id="preview-label">Button</span>
                </div>
              </div>
              <div class="field-row">
                <label>Label</label>
                <input type="text" id="ed-label" placeholder="Button text" maxlength="20">
              </div>
              <div class="field-row">
                <label>Color</label>
                <div class="color-strip" id="ed-colors"></div>
              </div>
              <div class="field-row">
                <label>Icon</label>
                <div class="icon-strip" id="ed-icons"></div>
              </div>
            </div>

            <!-- Actions -->
            <div class="editor-section">
              <div class="editor-section-title">Actions <span class="section-hint">(on press)</span></div>
              <div id="actions-list"></div>
              <button class="add-btn" id="add-action">+ Add Action</button>
            </div>

            <!-- Feedbacks -->
            <div class="editor-section">
              <div class="editor-section-title">Feedbacks <span class="section-hint">(live state)</span></div>
              <div id="feedbacks-list"></div>
              <button class="add-btn" id="add-feedback">+ Add Feedback</button>
              <p class="section-note">First matching rule sets the color. Otherwise button keeps base color.</p>
            </div>

          </div>
        </div>

      </div>
    </section>

    <!-- Pages Section -->
    <section class="section" id="section-pages">
      <div class="pages-panel">
        <div class="pages-header">
          <h2>Page Manager</h2>
          <button class="add-btn" id="add-page">+ Add Page</button>
        </div>
        <div id="pages-list"></div>
      </div>
    </section>

    <!-- Settings Section -->
    <section class="section" id="section-settings">
      <div class="settings-panel">
        <h2>Settings</h2>
        <div class="field-row">
          <label>Grid Rows</label>
          <input type="number" id="set-rows" min="1" max="20" value="4">
        </div>
        <div class="field-row">
          <label>Grid Columns</label>
          <input type="number" id="set-cols" min="1" max="20" value="8">
        </div>
        <div class="field-row">
          <label>PIN Code</label>
          <input type="text" id="set-pin" maxlength="8" placeholder="1234">
        </div>
        <button class="save-btn" id="save-settings">Save Settings</button>
      </div>
    </section>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
